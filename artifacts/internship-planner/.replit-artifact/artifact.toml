kind = "web"
previewPath = "/"
title = "Internship Planner"
description = "A fresh source-backed internship discovery and readiness planner for students, with live TinyFish discovery and capacity-aware Research and Company roadmaps."
version = "1.0.0"
id = "artifacts/internship-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22950

[services.development]
run = "pnpm --filter @workspace/internship-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/internship-planner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/internship-planner", "run", "start" ]

[services.env]
PORT = "22950"
BASE_PATH = "/"
